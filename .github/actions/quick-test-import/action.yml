name: Run test (Import)
description: Downloads Godot and runs the project to quickly check for crashes.
inputs:
  godot_bin:
    required: true
    description: Path to Godot Binary
  should_run:
    required: true
    description: "'true' or 'false'"


runs:
  using: "composite"
  steps:
    - name: Run test room (Import)
      shell: bash
      if: ${{ inputs.should_run == 'true' }}
      continue-on-error: true
      run: |
        export WINEPREFIX="$(pwd)/.wine_tmp"
        mkdir -p "$WINEPREFIX"

        # Build a throwaway project around the freshly built addon.
        SMOKE="$(mktemp -d)"
        mkdir -p "$SMOKE/addons"
        cp -r addons/gde_gozen "$SMOKE/addons/gde_gozen"
        printf 'config_version=5\n\n[application]\n\nconfig/name="gde_gozen_smoke"\nconfig/features=PackedStringArray("4.5")\n' > "$SMOKE/project.godot"

        GODOT_BIN="${{ inputs.godot_bin }}"
        $GODOT_BIN --headless --verbose --path "$SMOKE" --quit-after 200 --import
